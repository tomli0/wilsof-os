name: Validate

on:
  push:
    branches: [arch-install, integration/internal3-20261030, stabilization/internal4-20261030, fix/internal4-completion]
  pull_request:
    branches: [main, integration/internal-iso-20261026, integration/internal3-20261030, stabilization/internal4-20261030]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run local checks
        run: |
          python -m pytest -q
          python -m json.tool config/wilsof-shortcuts.json >/dev/null
          python -m json.tool config/dms/settings-template.json >/dev/null
          python -m json.tool config/dms/wilsof-theme.json >/dev/null
          shellcheck --exclude=SC1091 --shell=sh bin/wilsof-session bin/wilsof-doctor bin/wilsof-help bin/wilsof-lock bin/wilsof-search bin/wilsof-vm-test-binds scripts/bootstrap-desktop.sh scripts/build-iso.sh scripts/install-user-config.sh scripts/preflight-arch.sh scripts/preflight-fedora.sh
          shellcheck --shell=bash automation/wilsof-github-worker.sh scripts/install-arch-test-vm.sh iso/profiledef.sh
          git diff --check
