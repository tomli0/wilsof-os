# Wilsof idle policy. The wrapper prevents duplicate Hyprlock instances.
general {
    # Hypridle's systemd service does not inherit ~/.local/bin in PATH.
    # HOME is supplied by the user service, so this stays user-scoped.
    lock_cmd = $HOME/.local/bin/wilsof-lock
    before_sleep_cmd = $HOME/.local/bin/wilsof-lock
}

listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/wilsof-lock
}
