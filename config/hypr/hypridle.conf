# Wilsof idle policy. The wrappers prevent duplicate Hyprlock instances.
general {
    # The wrapper name is not detected by Hypridle's literal hyprlock heuristic.
    # Keep sleep inhibited until the compositor reports a real session lock.
    inhibit_sleep = 3
    # Hypridle's systemd service does not inherit ~/.local/bin in PATH.
    # HOME is supplied by the user service, so this stays user-scoped.
    lock_cmd = $HOME/.local/bin/wilsof-lock
    before_sleep_cmd = $HOME/.local/bin/wilsof-lock
}

# 3 minutes: Terminal Idle — the approved [ W S ] idle surface. It is the same
# PAM-backed Hyprlock, so no unlocked session content can ever be exposed.
listener {
    timeout = 180
    on-timeout = $HOME/.local/bin/wilsof-idle
}

# 5 minutes: secure Hyprlock. The Terminal Idle tier already locks the session;
# this tier re-asserts the standard lock surface and is a deduplicated no-op
# while any Hyprlock instance is active.
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/wilsof-lock
}

# 10 minutes: display off. Input restores the output while the lock persists.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
