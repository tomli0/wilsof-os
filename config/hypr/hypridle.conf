# Wilsof idle policy. The wrapper prevents duplicate Hyprlock instances.
general {
    lock_cmd = wilsof-lock
    before_sleep_cmd = wilsof-lock
    after_sleep_cmd = hyprctl dispatch 'dpms on'
}

listener {
    timeout = 300
    on-timeout = wilsof-lock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'dpms off'
    on-resume = hyprctl dispatch 'dpms on'
}
