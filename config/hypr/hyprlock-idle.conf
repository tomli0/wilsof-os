# Wilsof Terminal Idle surface. Hyprlock still performs PAM authentication;
# this file only defines the approved idle presentation: flat #090F14
# background, centered [ W S ] mark, SYSTEM IDLE_ caption, no animation.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    # A flat colour surface must lock before any optional asset gathering.
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    path =
    color = rgb(9, 15, 20)
    blur_passes = 0
}

label {
    monitor =
    text = [ W S ]
    color = rgb(134, 185, 206)
    font_size = 96
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = SYSTEM IDLE_
    color = rgb(200, 215, 222)
    font_size = 16
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    inner_color = rgba(9, 15, 20, 0.92)
    outer_color = rgb(134, 185, 206)
    check_color = rgb(134, 185, 206)
    fail_color = rgb(230, 160, 160)
    font_color = rgb(231, 238, 242)
    fade_on_empty = false
    rounding = 6
    font_family = $font
    placeholder_text =
    fail_text = Feil passord
    check_text = Kontrollerer …
    dots_center = true
    dots_spacing = 0.25
    position = 0, -120
    halign = center
    valign = center
}
