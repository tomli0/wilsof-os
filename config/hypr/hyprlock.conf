# Wilsof lock surface. Hyprlock performs PAM authentication; this file only defines presentation.
$font = Inter Variable

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.local/share/wilsof-os/assets/Mørk geometrisk bakgrunn med isblått WS-monogram.png
    color = rgb(20, 24, 30)
    blur_passes = 2
    blur_size = 4
}

image {
    monitor =
    path = ~/.local/share/wilsof-os/assets/Wilsof OS-logo med geometrisk WS-monogram.png
    size = 280, 0
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(231, 238, 242)
    font_size = 64
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d. %B"
    color = rgb(200, 215, 222)
    font_size = 18
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 54
    outline_thickness = 2
    inner_color = rgba(20, 24, 30, 0.92)
    outer_color = rgb(134, 185, 206)
    check_color = rgb(134, 185, 206)
    fail_color = rgb(230, 160, 160)
    font_color = rgb(231, 238, 242)
    fade_on_empty = false
    rounding = 6
    font_family = $font
    placeholder_text = Skriv passord for å låse opp
    fail_text = Feil passord
    check_text = Kontrollerer …
    dots_center = true
    dots_spacing = 0.25
    position = 0, -105
    halign = center
    valign = center
}

label {
    monitor =
    text = Esc tømmer feltet
    color = rgb(200, 215, 222)
    font_size = 14
    font_family = $font
    position = 0, -165
    halign = center
    valign = center
}
