# Wilsof OS prototype profile — copied into ~/.config/hypr after dms setup.
# Requires: Hyprland, DankMaterialShell, a user D-Bus/systemd session, wilsof-search.
# No application-specific bindings: Super+Space is the sole application entrypoint.

$mod = SUPER

monitor = ,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start wilsof-session.target

input {
  kb_layout = no
  follow_mouse = 1
}

general {
  gaps_in = 8
  gaps_out = 10
  border_size = 1
  col.active_border = rgb(86b9ce)
  col.inactive_border = rgb(3a424b)
  layout = dwindle
}

decoration {
  rounding = 6
  active_opacity = 1.0
  inactive_opacity = 0.96
  shadow { enabled = false }
}

animations {
  enabled = true
  animation = windows, 1, 5, default
  animation = fade, 1, 4, default
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

# Common search surface (Wilsof extension wraps DMS Spotlight providers).
bind = SUPER, SPACE, exec, wilsof-search toggle

# Window movement and workspace navigation.
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER CTRL, left, resizeactive, -40 0
bind = SUPER CTRL, right, resizeactive, 40 0
bind = SUPER CTRL, up, resizeactive, 0 -40
bind = SUPER CTRL, down, resizeactive, 0 40
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER SHIFT, SPACE, togglefloating,
bind = SUPER, L, exec, loginctl lock-session
ecosystem {
    # Wilsof supplies its own onboarding/help, not the optional upstream popup.
    no_update_news = true
}
