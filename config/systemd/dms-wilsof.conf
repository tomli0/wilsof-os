[Service]
# Software-rendered disposable VMs can exceed the upstream 90-second cold start.
TimeoutStartSec=300
# Wilsof uses an explicit static theme; do not derive the shell palette from a wallpaper.
Environment=DMS_DISABLE_MATUGEN=1
# Requeue after each successful DMS start, including recovery from dependency failure.
# Never wait here: wallpaper is ordered After=dms.service, including this post-hook.
# A cosmetic activation failure must not take down the desktop.
ExecStartPost=-/usr/bin/systemctl --user --no-block start wilsof-wallpaper.service
