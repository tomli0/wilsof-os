<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wilsof OS — desktop prototype</title>
<style>
:root{--ink:#14181e;--surface:#191f27;--surface2:#202832;--line:#3a424b;--accent:#86b9ce;--muted:#a9b2bb;--text:#f0f5f7}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--ink);color:var(--text);font:14px/1.35 "Noto Sans",Cantarell,system-ui,sans-serif}.desktop{height:100vh;background:linear-gradient(90deg,rgba(20,24,30,.25),rgba(20,24,30,.25)),url('../assets/Mørk geometrisk bakgrunn med isblått WS-monogram.png') center/cover no-repeat}.bar{height:32px;background:rgba(15,18,23,.94);border-bottom:1px solid #212932;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.workspaces{display:flex;height:100%;gap:4px}.workspace{min-width:30px;display:grid;place-items:center;color:#87919b}.workspace.active{color:var(--ink);background:var(--accent);font-weight:700}.title{color:#bec9d0}.status{display:flex;gap:14px;color:#bec9d0}.status button{color:inherit;border:0;background:none;font:inherit;padding:4px;cursor:pointer}.status button:focus-visible,.result:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.hint{position:absolute;right:20px;bottom:16px;color:#c9d4db80;font-size:12px}.palette{display:none;position:absolute;top:76px;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 120px);background:#151a20f7;border:1px solid #4e5a64;border-radius:8px;box-shadow:0 18px 50px #0008;overflow:auto}.palette.open{display:block}.search{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #303a44}.search span{color:var(--accent);font-size:20px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:17px "Noto Sans",sans-serif}.search input::placeholder{color:#8e99a3}.section{padding:12px 8px 4px;color:#9bacb7;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.result{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;background:transparent;color:var(--text);text-align:left;font:14px inherit;cursor:pointer}.result[aria-selected="true"],.result:hover{background:#27323d}.glyph{display:grid;place-items:center;width:25px;height:25px;border:1px solid #5e6c77;border-radius:5px;color:var(--accent);font-size:13px}.copy{display:grid;gap:2px}.copy small{color:var(--muted)}.key{margin-left:auto;color:#aebac3;font:12px ui-monospace,monospace}.empty{padding:24px 16px;color:var(--muted)}dialog{width:min(420px,calc(100vw - 32px));color:var(--text);background:#171d24;border:1px solid var(--accent);border-radius:8px;box-shadow:0 18px 50px #0008;padding:20px}dialog::backdrop{background:#0009}dialog p{color:var(--muted)}dialog button{margin-right:8px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:#202832;color:var(--text);cursor:pointer}dialog button.primary{border-color:var(--accent);color:var(--accent)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="desktop"><header class="bar"><nav class="workspaces" aria-label="Arbeidsområder"><span class="workspace active">01</span><span class="workspace">02</span><span class="workspace">03</span></nav><span class="title">Wilsof OS</span><div class="status"><span>◒</span><span>⌁</span><button id="open" aria-label="Åpne Wilsof-søk">22:08</button></div></header><p class="hint">Super + Space · felles søk</p><section class="palette" id="palette" aria-label="Wilsof-søk" role="dialog"><div class="search"><span>⌕</span><input id="query" autocomplete="off" placeholder="Søk i Wilsof OS" aria-label="Søk i programmer, filer, vinduer og innstillinger"></div><div id="results"></div></section><dialog id="confirm"><h2 id="confirmTitle">Bekreft handling</h2><p id="confirmText"></p><button id="cancel">Avbryt</button><button class="primary" id="proceed">Fortsett</button></dialog></main><script>
const rows=[['Programmer','Firefox','Nettleser','◉'],['Programmer','Ghostty','Terminal','>_'],['Programmer','Filer','Nautilus','▣'],['Filer og mapper','Dokumenter','~/Dokumenter','□'],['Åpne vinduer','Arbeidsprofiler','Firefox · arbeidsområde 1','▤'],['Innstillinger og system','Innstillinger','Wilsof OS-innstillinger','⚙'],['Innstillinger og system','Lås','Lås økten nå','▣'],['Innstillinger og system','Omstart','Krever bekreftelse','↻'],['Innstillinger og system','Slå av','Krever bekreftelse','⏻'],['Innstillinger og system','Logg ut','Krever bekreftelse','⇥'],['Innstillinger og system','Hvile','Sett systemet i hvilemodus','◒']];
const aliases={omstart:'Omstart',reboot:'Omstart','slå av':'Slå av',shutdown:'Slå av',lås:'Lås',lock:'Lås',hvile:'Hvile',suspend:'Hvile','logg ut':'Logg ut',logout:'Logg ut',innstillinger:'Innstillinger',settings:'Innstillinger'};let selected=0;const p=document.querySelector('#palette'),q=document.querySelector('#query'),out=document.querySelector('#results'),d=document.querySelector('#confirm');
function filtered(){const v=q.value.trim().toLocaleLowerCase('no');const normalized=aliases[v]||v;return rows.filter(r=>!normalized||r.slice(1).join(' ').toLocaleLowerCase('no').includes(normalized))}function render(){const list=filtered();selected=Math.min(selected,Math.max(0,list.length-1));let previous='';out.innerHTML=list.length?'':'';if(!list.length){out.innerHTML='<p class="empty">Ingen lokale treff.</p>';return}list.forEach((r,i)=>{if(r[0]!==previous){out.insertAdjacentHTML('beforeend',`<div class="section">${r[0]}</div>`);previous=r[0]}out.insertAdjacentHTML('beforeend',`<button class="result" data-name="${r[1]}" aria-selected="${i===selected}"><span class="glyph">${r[3]}</span><span class="copy">${r[1]}<small>${r[2]}</small></span>${i===selected?'<span class="key">↵</span>':''}</button>`)});out.querySelectorAll('.result').forEach((el,i)=>el.onclick=()=>activate(filtered()[i]))}function open(){p.classList.add('open');q.focus();render()}function close(){p.classList.remove('open');q.value='';selected=0}function activate(r){if(['Omstart','Slå av','Logg ut'].includes(r[1])){document.querySelector('#confirmTitle').textContent=r[1];document.querySelector('#confirmText').textContent=`${r[1]} krever en tastaturbetjent bekreftelse.`;d.showModal();return}if(r[1]==='Lås'){close();return}close()}q.addEventListener('input',()=>{selected=0;render()});document.addEventListener('keydown',e=>{if(e.key===' '&&e.metaKey||e.key===' '&&e.ctrlKey&&false){e.preventDefault();open()}if(!p.classList.contains('open'))return;if(e.key==='Escape'){close()}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=filtered().length;selected=(selected+(e.key==='ArrowDown'?1:-1)+n)%n;render()}if(e.key==='Enter'){activate(filtered()[selected])}});document.querySelector('#open').onclick=open;document.querySelector('#cancel').onclick=()=>d.close();document.querySelector('#proceed').onclick=()=>d.close();
</script></body></html>
